services:
  gateway-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: npm run dev
    env_file:
      - .env
    ports:
      - "8080:8080"
    volumes:
      - ./gateway:/app
      - /app/node_modules
      - /opt/llama:/opt/llama:ro
      - /opt/qwen-model:/models
      - /etc/os-release:/host-os-release:ro
      - /proc/mounts:/host-mounts:ro
    depends_on:
      - redis
    restart: unless-stopped

  ui-dev:
    image: node:22-trixie-slim
    working_dir: /app
    command: bash -lc "npm install --no-audit --no-fund && npm run dev -- --host"
    ports:
      - "5173:5173"
    volumes:
      - ./ui:/app
      - ui-node_modules:/app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - gateway-dev
    restart: unless-stopped

  gateway-test:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: npm test
    env_file:
      - .env
    environment:
      - NODE_ENV=test
    volumes:
      - ./gateway:/app
      - /app/node_modules

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redis-data:/data
    restart: unless-stopped

  analytics:
    build:
      context: .
      dockerfile: analytics/Dockerfile
    env_file:
      - .env
    environment:
      - ANALYTICS_PORT=8081
      - ANALYTICS_GATEWAY_URL=http://gateway-dev:8080
    volumes:
      - /opt/qwen-ml:/opt/qwen-ml
    depends_on:
      - redis
    restart: unless-stopped

  analytics-test:
    build:
      context: .
      dockerfile: analytics/Dockerfile
    command: pytest -q
    env_file:
      - .env
    environment:
      - ANALYTICS_DB_FILE=/app/tests/analytics-test.db
      - REDIS_URL=
    volumes:
      - ./analytics:/app

volumes:
  redis-data:
  ui-node_modules: